<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Faso Digital Shop : guides numériques pour apprendre l'IA, l'informatique et préparer son emploi.">
  <title>Faso Digital Shop</title>

  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- EN-TÊTE : logo, nom et drapeau -->
  <header class="site-header">
    <img class="brand-mark" src="images/logo-mark.png" alt="Logo Faso Digital Shop">
    <div class="brand-divider"></div>

    <div class="brand-text">
      <h1 aria-label="Faso Digital">FASO<span>DIGITAL</span></h1>
      <p>Le savoir numérique à portée de main.</p>
    </div>

    <!-- Drapeau du Burkina Faso -->
    <svg class="flag" viewBox="0 0 30 20" role="img" aria-label="Drapeau du Burkina Faso">
      <rect width="30" height="10" fill="#e8112d"/>
      <rect y="10" width="30" height="10" fill="#009e49"/>
      <polygon fill="#ffe21a" points="15,5.5 16.01,8.61 19.28,8.61 16.64,10.53 17.65,13.64 15,11.72 12.35,13.64 13.36,10.53 10.72,8.61 13.99,8.61"/>
    </svg>
  </header>

  <!-- BANNIÈRE ET RECHERCHE -->
  <section class="hero">
    <img class="hero-img" src="images/hero-monument.jpg" alt="">

    <div class="hero-content">
      <svg class="hero-book" viewBox="0 0 64 56" aria-hidden="true">
        <path d="M32 10C25 5 14 4 4 7v38c10-3 21-2 28 3 7-5 18-6 28-3V7c-10-3-21-2-28 3z" fill="#fff" stroke="#e0a800" stroke-width="3" stroke-linejoin="round"/>
        <path d="M8 11c8-1.500 17-.5 22 3v28c-6-3-14-4-22-2.500z" fill="#0b6b3a"/>
        <path d="M56 11c-8-1.500-17-.5-22 3v28c6-3 14-4 22-2.500z" fill="#0b6b3a"/>
        <path d="M13 18h12M13 24h12M13 30h12M39 18h12M39 24h12M39 30h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <div>
        <h2>Développe tes connaissances.</h2>
        <p>Découvre nos guides, livres et ressources numériques.</p>
      </div>
    </div>

    <label class="search-box">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.500" cy="10.500" r="6.500"/><path d="M15.500 15.500L21 21"/>
      </svg>
      <input type="search" id="search" placeholder="Rechercher un produit..." aria-label="Rechercher un produit">
    </label>
  </section>

  <main class="site-main">
    <h2 class="section-title">Nos produits numériques</h2>

    <!-- Panier, catégories et tri sont ajoutés ici par script.js -->
    <div id="products" class="products"></div>
    <!-- Paiement, avis, FAQ, Premium... sont ajoutés ici par script.js -->
  </main>

  <footer class="site-footer">
    <img class="foot-pattern" src="images/foot-left.png" alt="">

    <div class="foot-text">
      <h2>FASO DIGITAL SHOP</h2>
      <p>Apprendre aujourd'hui, réussir demain.</p>
      <p>© 2026 - Tous droits réservés.</p>
    </div>

    <img class="foot-pattern" src="images/foot-right.png" alt="">
  </footer>

  <script src="script.js"></script>
  <script src="account.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
